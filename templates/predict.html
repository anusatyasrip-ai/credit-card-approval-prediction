{% extends 'base.html' %}

{% block title %}Check Eligibility - Credit Card Approval System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            
            <!-- Header with Quick Sample Buttons -->
            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
                <div>
                    <h3 class="fw-bold text-dark mb-1">Check Credit Eligibility</h3>
                    <p class="text-muted small mb-0">Fill in the details below to receive an instant ML approval decision.</p>
                </div>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-outline-custom btn-sm rounded-pill" onclick="loadSampleApplicant('approved')">
                        <i class="fa-solid fa-check text-success me-1"></i> Approved Sample
                    </button>
                    <button type="button" class="btn btn-outline-custom btn-sm rounded-pill" onclick="loadSampleApplicant('rejected')">
                        <i class="fa-solid fa-xmark text-danger me-1"></i> Rejected Sample
                    </button>
                </div>
            </div>

            <!-- Form Card -->
            <div class="card-clean p-4 p-md-5">
                <form action="{{ url_for('predict_post') }}" method="POST" id="predictionForm" onsubmit="return validatePredictionForm()">
                    
                    <!-- Section 1: Profile & Employment -->
                    <div class="form-group-title">
                        <i class="fa-solid fa-user me-2 text-primary"></i> 1. Profile & Employment
                    </div>
                    
                    <div class="row g-3 mb-4">
                        <div class="col-sm-6">
                            <label for="gender" class="form-label">Gender</label>
                            <select class="form-select" id="gender" name="gender" required>
                                <option value="" disabled selected>Select gender</option>
                                <option value="Female">Female</option>
                                <option value="Male">Male</option>
                            </select>
                        </div>
                        
                        <div class="col-sm-6">
                            <label for="education_level" class="form-label">Education Level</label>
                            <select class="form-select" id="education_level" name="education_level" required>
                                <option value="" disabled selected>Select education</option>
                                <option value="Higher education">Higher Education (Bachelor/Master)</option>
                                <option value="Secondary / secondary special">Secondary / High School</option>
                                <option value="Incomplete higher">Incomplete Higher</option>
                                <option value="Lower secondary">Lower Secondary</option>
                                <option value="Academic degree">Academic Degree (PhD)</option>
                            </select>
                        </div>

                        <div class="col-sm-4">
                            <label for="income_type" class="form-label">Income Type</label>
                            <select class="form-select" id="income_type" name="income_type" required>
                                <option value="" disabled selected>Select type</option>
                                <option value="Salary">Salary</option>
                                <option value="Self-Employed">Self-Employed</option>
                                <option value="Business">Business</option>
                                <option value="Pensioner">Pensioner</option>
                                <option value="Commercial">Commercial</option>
                            </select>
                        </div>

                        <div class="col-sm-4">
                            <label for="employment_status" class="form-label">Employment Status</label>
                            <select class="form-select" id="employment_status" name="employment_status" required>
                                <option value="" disabled selected>Select status</option>
                                <option value="Employed">Employed</option>
                                <option value="Self-Employed">Self-Employed</option>
                                <option value="Pensioner">Pensioner</option>
                                <option value="Student">Student</option>
                                <option value="Unemployed">Unemployed</option>
                            </select>
                        </div>

                        <div class="col-sm-4">
                            <label for="employment_years" class="form-label">Employment (Years)</label>
                            <input type="number" step="0.1" min="0" max="50" class="form-control" id="employment_years" name="employment_years" placeholder="e.g. 4.5" required>
                        </div>
                    </div>

                    <!-- Section 2: Financials & Credit History -->
                    <div class="form-group-title">
                        <i class="fa-solid fa-wallet me-2 text-primary"></i> 2. Financials & Credit
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-sm-6">
                            <label for="annual_income" class="form-label">Annual Income ($)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted">$</span>
                                <input type="number" step="100" min="0" class="form-control" id="annual_income" name="annual_income" placeholder="e.g. 60000" required>
                            </div>
                        </div>

                        <div class="col-sm-6">
                            <label for="existing_loan_balance" class="form-label">Existing Loan Balance ($)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted">$</span>
                                <input type="number" step="100" min="0" class="form-control" id="existing_loan_balance" name="existing_loan_balance" placeholder="e.g. 10000" required>
                            </div>
                        </div>

                        <div class="col-sm-4">
                            <label for="credit_history_years" class="form-label">Credit History (Years)</label>
                            <input type="number" step="0.1" min="0" max="60" class="form-control" id="credit_history_years" name="credit_history_years" placeholder="e.g. 5.0" required>
                        </div>

                        <div class="col-sm-4">
                            <label for="credit_inquiries" class="form-label">Inquiries (Last 6 Mo)</label>
                            <input type="number" step="1" min="0" max="30" class="form-control" id="credit_inquiries" name="credit_inquiries" placeholder="e.g. 1" required>
                        </div>

                        <div class="col-sm-4">
                            <label for="payment_status" class="form-label">Past Payment Status</label>
                            <select class="form-select" id="payment_status" name="payment_status" required>
                                <option value="" disabled selected>Select status</option>
                                <option value="No Past Due">No Past Due (Clean)</option>
                                <option value="Past Due">Past Due (Late/Default)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <button type="reset" class="btn btn-outline-custom px-4 rounded-pill">Reset</button>
                        <button type="submit" class="btn btn-primary-custom px-4 py-2 rounded-pill">
                            <i class="fa-solid fa-magnifying-glass me-1"></i> Evaluate Application
                        </button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>
{% endblock %}
